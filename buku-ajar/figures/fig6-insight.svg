ht="bold" text-anchor="middle" letter-spacing="0">REKOMENDASI</text><text x="965.0" y="106" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10" fill="#333333" font-weight="normal" text-anchor="middle" letter-spacing="0">alokasikan 60% budget ke format tutorial</text><text x="965.0" y="124" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#777777" font-weight="normal" text-anchor="middle" letter-spacing="0">ambil keputusan + ukur dampaknya</text><line x1="30" y1="190" x2="1090" y2="190" stroke="#CCCCCC" stroke-width="1"/><text x="30" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#0A5C46" font-weight="bold" text-anchor="start" letter-spacing="0">Kualitas naik</text><text x="1090" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#8A3D00" font-weight="bold" text-anchor="end" letter-spacing="0">Risiko salah-tafsir naik</text><line x1="240" y1="186" x2="860" y2="172" stroke="#0A5C46" stroke-width="1.6" marker-end="url(#ah)"/><text x="31" y="240" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">Jebakan umum:</text><text x="46" y="262" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.8" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">✗ Menyebut metrik sebagai insight ("engagement naik" = temuan, bukan insight)</text><text x="46" y="278" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.8" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">✗ Naik tingkat tanpa bukti tingkat bawah (rekomendasi tanpa diagnostik)</text><text x="46" y="294" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.8" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">✗ Menggeneralisasi satu platform ke seluruh platform</text><text x="46" 