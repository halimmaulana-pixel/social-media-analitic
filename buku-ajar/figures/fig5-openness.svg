<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Lanskap keterbukaan data platform 2026" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4D4D4D"/></marker></defs>
<rect x="0" y="0" width="1000" height="400" fill="#FFFFFF"/>
<text x="500" y="30" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">Gambar 5. Lanskap keterbukaan data platform (indikatif, 2026)</text><text x="500" y="50" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="middle" letter-spacing="0">Skor keterbukaan akses riset 0–10: open protocol/terbuka (hijau) · API resmi terbatas (biru) · gated/berbayar (oranye)</text><text x="318" y="91" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="end" letter-spacing="0">Bluesky (AT Protocol / Jetstream)</text><rect x="330" y="74" width="468" height="26" rx="4" fill="#009E73" stroke="#009E73" stroke-width="1.0" opacity="0.85"/><text x="806.0" y="91" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#009E73" font-weight="bold" text-anchor="start" letter-spacing="0">9.0</text><text x="342" y="91" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#FFFFFF" font-weight="normal" text-anchor="start" letter-spacing="0">Terbuka, firehose penuh, tanpa kuota akademik</text><text x="318" y="123" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="end" letter-spacing="0">Reddit API</text><rect x="330" y="106" width="364" height="26" rx="4" fill="#009E73" stroke="#009E73" stroke-width="1.0" opacity="0.85"/><text x="702.0" y="123" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#009E73" font-weight="bold" text-anchor="start" letter-spacing="0">7.0</text><text x="342" y="123" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#FFFFFF" font-weight="normal" text-anchor="start" letter-spacing="0">Terbuka dengan rate limit &amp; kebijakan 2023</text><text x="318" y="155" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="end" letter-spacing="0">YouTube Data API</text><rect x="330" y="138" width="364" height="26" rx="4" fill="#009E73" stroke="#009E73" stroke-width="1.0" opacity="0.85"/><text x="702.0" y="155" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#009E73" font-weight="bold" text-anchor="start" letter-spacing="0">7.0</text><text x="342" y="155" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#FFFFFF" font-weight="normal" text-anchor="start" letter-spacing="0">Terbuka dengan kuota harian</text><text x="318" y="187" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="end" letter-spacing="0">TikTok Research API</text><rect x="330" y="170" width="286" height="26" rx="4" fill="#0072B2" stroke="#0072B2" stroke-width="1.0" opacity="0.85"/><text x="624.0" y="187" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#0072B2" font-weight="bold" text-anchor="start" letter-spacing="0">5.5</text><text x="342" y="187" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Terbatas: pendaftaran &amp; tujuan riset</text><text x="318" y="219" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="end" letter-spacing="0">X / Twitter API v2</text><rect x="330" y="202" width="208" height="26" rx="4" fill="#D55E00" stroke="#D55E00" stroke-width="1.0" opacity="0.85"/><text x="546.0" y="219" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#D55E00" font-weight="bold" text-anchor="start" letter-spacing="0">4.0</text><text x="342" y="219" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Berbayar; akses akademik gratis dihapus 2023</text><text x="318" y="251" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="end" letter-spacing="0">Instagram / Threads (Meta)</text><rect x="330" y="234" width="156" height="26" rx="4" fill="#D55E00" stroke="#D55E00" stroke-width="1.0" opacity="0.85"/><text x="494.0" y="251" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#D55E00" font-weight="bold" text-anchor="start" letter-spacing="0">3.0</text><text x="342" y="251" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Gated: eligibility institusi akademik</text><text x="318" y="283" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="end" letter-spacing="0">Facebook (Meta Content Library)</text><rect x="330" y="266" width="130" height="26" rx="4" fill="#D55E00" stroke="#D55E00" stroke-width="1.0" opacity="0.85"/><text x="468.0" y="283" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#D55E00" font-weight="bold" text-anchor="start" letter-spacing="0">2.5</text><text x="342" y="283" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Gated; enclave riset mulai berbayar 2026</text><text x="500" y="338" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="middle" letter-spacing="0">Implikasi kurikulum: rancang studi yang tetap feasible saat akses tertutup — gunakan protokol terbuka,</text><text x="500" y="355" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="normal" text-anchor="middle" letter-spacing="0">arsip publik, metadata-first design, atau kolaborasi institusi ber-akses.</text><text x="500" y="376" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10" fill="#8A3D00" font-weight="normal" text-anchor="middle" letter-spacing="0">Skor bersifat indikatif untuk tujuan pengajaran; verifikasi tier, kuota, dan biaya sebelum menyusun RPS.</text></svg>