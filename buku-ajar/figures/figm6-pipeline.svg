<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 250' width='980' height='250' role='img' aria-label='Peta jalan preprocessing tujuh tahap dengan gate'><rect x='0' y='0' width='980' height='250' rx='0' fill='#ffffff' stroke='#cbd5e1' stroke-width='1.2'/><rect x='18' y='60' width='128' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='82' y='82' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='middle' font-weight='bold'>1. Cek integritas</text><text x='82' y='98' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>parse JSON, hitung</text><text x='82' y='111' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>baris, field hilang</text><text x='82' y='148' font-family='Georgia, serif' font-size='9' fill='#059669' text-anchor='middle' font-weight='normal'>lolos kalau parse error 0</text><line x1='147' y1='97' x2='156' y2='97' stroke='#2563eb' stroke-width='1.6'/><polygon points='156.0,97.0 147.8,100.7 147.8,93.3' fill='#2563eb'/><rect x='158' y='60' width='128' height='74' rx='8' fill='#eff6ff' stroke='#2563eb' stroke-width='1.2'/><text x='222' y='82' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='middle' font-weight='bold'>2. Deduplikasi</text><text x='222' y='98' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>MinHash + rantai</text><text x='222' y='111' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>reshare</text><text x='222' y='148' font-family='Georgia, serif' font-size='9' fill='#059669' text-anchor='middle' font-weight='normal'>tandai, jangan hapus opini baru</text><line x1='287' y1='97' x2='296' y2='97' stroke='#2563eb' stroke-width='1.6'/><polygon points='296.0,97.0 287.8,100.7 287.8,93.3' fill='#2563eb'/><rect x='298' y='60' width='128' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='362' y='82' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='middle' font-weight='bold'>3. Saring bot</text><text x='362' y='98' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>6 heuristik, skor</text><text x='362' y='111' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>0-1</text><text x='362' y='148' font-family='Georgia, serif' font-size='9' fill='#059669' text-anchor='middle' font-weight='normal'>di bawah 0.5 lanjut, sisanya audit</text><line x1='427' y1='97' x2='436' y2='97' stroke='#2563eb' stroke-width='1.6'/><polygon points='436.0,97.0 427.8,100.7 427.8,93.3' fill='#2563eb'/><rect x='438' y='60' width='128' height='74' rx='8' fill='#eff6ff' stroke='#2563eb' stroke-width='1.2'/><text x='502' y='82' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='middle' font-weight='bold'>4. Normalisasi</text><text x='502' y='98' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>slang, emoji, huruf</text><text x='502' y='111' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>panjang</text><text x='502' y='148' font-family='Georgia, serif' font-size='9' fill='#059669' text-anchor='middle' font-weight='normal'>negasi dan entitas jangan hilang</text><line x1='567' y1='97' x2='576' y2='97' stroke='#2563eb' stroke-width='1.6'/><polygon points='576.0,97.0 567.8,100.7 567.8,93.3' fill='#2563eb'/><rect x='578' y='60' width='128' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='642' y='82' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='middle' font-weight='bold'>5. Deteksi bahasa</text><text x='642' y='98' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>fastText/CLD per</text><text x='642' y='111' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>kalimat</text><text x='642' y='148' font-family='Georgia, serif' font-size='9' fill='#059669' text-anchor='middle' font-weight='normal'>campur kode tetap diproses</text><line x1='707' y1='97' x2='716' y2='97' stroke='#2563eb' stroke-width='1.6'/><polygon points='716.0,97.0 707.8,100.7 707.8,93.3' fill='#2563eb'/><rect x='718' y='60' width='128' height='74' rx='8' fill='#eff6ff' stroke='#2563eb' stroke-width='1.2'/><text x='782' y='82' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='middle' font-weight='bold'>6. Tokenisasi</text><text x='782' y='98' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>kata dasar, hashtag</text><text x='782' y='111' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>dipecah</text><text x='782' y='148' font-family='Georgia, serif' font-size='9' fill='#059669' text-anchor='middle' font-weight='normal'>token mewakili unit makna</text><line x1='847' y1='97' x2='856' y2='97' stroke='#2563eb' stroke-width='1.6'/><polygon points='856.0,97.0 847.8,100.7 847.8,93.3' fill='#2563eb'/><rect x='858' y='60' width='128' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='922' y='82' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='middle' font-weight='bold'>7. Quality gate</text><text x='922' y='98' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>cek ulang sampel 5</text><text x='922' y='111' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='middle' font-weight='normal'>persen</text><text x='922' y='148' font-family='Georgia, serif' font-size='9' fill='#059669' text-anchor='middle' font-weight='normal'>catat angka sebelum/sesudah</text><text x='490' y='28' font-family='Georgia, serif' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold'>Peta jalan preprocessing: tujuh tahap berurutan, tiap tahap punya gate</text><text x='490' y='46' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='middle' font-weight='normal'>Urutan penting: normalisasi teks dijalankan setelah data bersih dari duplikat dan akun bot</text><text x='18' y='190' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>Bacaan: setiap kotak menyatakan satu tahap. Baris hijau adalah syarat lanjut sebelum tahap berikutnya dijalankan.</text><text x='18' y='208' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>Prinsip: semua keputusan tahap ini dicatat dalam cleaning log, lengkap dengan angka sebelum dan sesudah.</text></svg>