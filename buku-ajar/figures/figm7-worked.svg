<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 430' width='980' height='430' role='img' aria-label='Contoh soal diagnosis dengan lima cacat bertanda materi asal'><rect x='0' y='0' width='980' height='430' rx='0' fill='#ffffff' stroke='#cbd5e1' stroke-width='1.2'/><text x='490' y='28' font-family='Georgia, serif' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold'>Contoh soal diagnosis: potongan laporan dengan lima cacat</text><text x='30' y='62' font-family='DejaVu Sans Mono, monospace' font-size='12' fill='#1e293b'>Bukti: Analisis sentimen atas 12.000 komentar tagar #isudesa dari platform X, diambil</text><text x='30' y='82' font-family='DejaVu Sans Mono, monospace' font-size='12' fill='#1e293b'>1-7 Januari. Karena seluruh komentar bersifat publik, pengumpulan dinilai etis tanpa</text><text x='30' y='102' font-family='DejaVu Sans Mono, monospace' font-size='12' fill='#1e293b'>persetujuan tambahan. Angka engagement digabungkan dari tiga metrik platform yang</text><text x='30' y='122' font-family='DejaVu Sans Mono, monospace' font-size='12' fill='#1e293b'>equivalen. Deduplikasi dilakukan dengan menghapus semua baris bernilai kemiripan</text><text x='30' y='142' font-family='DejaVu Sans Mono, monospace' font-size='12' fill='#1e293b'>di atas 0,60, dan bot disaring memakai ambang 0,30 agar hasil bersih sempurna.</text><rect x='30' y='162' width='920' height='34' rx='6' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='42' y='178' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='bold'>Cacat 1 (Materi 2)</text><text x='190' y='178' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>"opini publik" dari 12.000 komentar tagar: tagar adalah sampling frame, bukan populasi.</text><rect x='30' y='202' width='920' height='34' rx='6' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='42' y='218' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='bold'>Cacat 2 (Materi 5)</text><text x='190' y='218' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>"publik berarti etis tanpa persetujuan": identifikasi data pribadi menurut UU PDP tetap berlaku.</text><rect x='30' y='242' width='920' height='34' rx='6' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='42' y='258' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='bold'>Cacat 3 (Materi 2)</text><text x='190' y='258' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>"tiga metrik yang dianggap setara": definisi engagement beda antar platform, wajib normalisasi.</text><rect x='30' y='282' width='920' height='34' rx='6' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='42' y='298' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='bold'>Cacat 4 (Materi 6)</text><text x='190' y='298' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>"hapus semua di atas 0,60": duplikat dekat bisa membawa klaim baru, wajib dibaca.</text><rect x='30' y='322' width='920' height='34' rx='6' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='42' y='338' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='bold'>Cacat 5 (Materi 6)</text><text x='190' y='338' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>"ambang 0,30": terlalu ketat, akun manusia aktif tersaring, hasil condong netral.</text><rect x='30' y='384' width='920' height='52' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='44' y='406' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='normal'>Cara menjawab: tulis nomor cacat, sebut materi asalnya, lalu satu kalimat koreksi.</text><text x='44' y='426' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>Contoh jawaban lengkap: "Cacat 1 dari Materi 2. Tagar adalah sampling frame; klaim tentang opini publik tidak sah."</text></svg>