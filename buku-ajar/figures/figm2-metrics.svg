<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="figm2 metrics" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#141414"/></marker></defs>
<rect x="10" y="46" width="980" height="414" rx="14" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="22" y="30" font-size="15" fill="#0072B2" font-weight="bold" text-anchor="start">Satu kata 'engagement' - empat definisi beda</text>
<rect x="30" y="66" width="216" height="190" rx="8" fill="#F2F8FD" stroke="#0072B2" stroke-width="1.8"/>
<text x="44" y="92" font-size="14" fill="#0072B2" font-weight="bold" text-anchor="start">X</text>
<text x="44" y="122" font-size="12.5" fill="#141414" text-anchor="start">- like (suka)</text>
<text x="44" y="150" font-size="12.5" fill="#141414" text-anchor="start">- repost (re-post)</text>
<text x="44" y="178" font-size="12.5" fill="#141414" text-anchor="start">- reply (jawab)</text>
<text x="44" y="206" font-size="12.5" fill="#141414" text-anchor="start">- quote + impression</text>
<rect x="274" y="66" width="216" height="190" rx="8" fill="#FDF1EA" stroke="#D55E00" stroke-width="1.8"/>
<text x="288" y="92" font-size="14" fill="#D55E00" font-weight="bold" text-anchor="start">TikTok</text>
<text x="288" y="122" font-size="12.5" fill="#141414" text-anchor="start">- like (suka)</text>
<text x="288" y="150" font-size="12.5" fill="#141414" text-anchor="start">- komentar</text>
<text x="288" y="178" font-size="12.5" fill="#141414" text-anchor="start">- share (bagikan)</text>
<text x="288" y="206" font-size="12.5" fill="#141414" text-anchor="start">- save + watch time</text>
<rect x="518" y="66" width="216" height="190" rx="8" fill="#F7F2FC" stroke="#7A4FA0" stroke-width="1.8"/>
<text x="532" y="92" font-size="14" fill="#7A4FA0" font-weight="bold" text-anchor="start">YouTube</text>
<text x="532" y="122" font-size="12.5" fill="#141414" text-anchor="start">- view (tonton)</text>
<text x="532" y="150" font-size="12.5" fill="#141414" text-anchor="start">- watch time total</text>
<text x="532" y="178" font-size="12.5" fill="#141414" text-anchor="start">- like (suka)</text>
<text x="532" y="206" font-size="12.5" fill="#141414" text-anchor="start">- komentar + share</text>
<rect x="762" y="66" width="216" height="190" rx="8" fill="#F1FAF5" stroke="#009E73" stroke-width="1.8"/>
<text x="776" y="92" font-size="14" fill="#009E73" font-weight="bold" text-anchor="start">Instagram</text>
<text x="776" y="122" font-size="12.5" fill="#141414" text-anchor="start">- like (suka)</text>
<text x="776" y="150" font-size="12.5" fill="#141414" text-anchor="start">- komentar</text>
<text x="776" y="178" font-size="12.5" fill="#141414" text-anchor="start">- save (simpan)</text>
<text x="776" y="206" font-size="12.5" fill="#141414" text-anchor="start">- share (bagikan)</text>
<text x="22" y="292" font-size="13" fill="#141414" font-weight="bold" text-anchor="start">Ambang perbandingan yang masih sah:</text>
<rect x="28" y="306" width="944" height="34" rx="6" fill="#F2F8FD" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="44" y="328" font-size="12" fill="#141414" text-anchor="start">1. Normalisasi: per 1.000 pengikut atau per 1.000 penonton - jangan raw count mentah.</text>
<rect x="28" y="346" width="944" height="34" rx="6" fill="#F2F8FD" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="44" y="368" font-size="12" fill="#141414" text-anchor="start">2. Damai komponen: hanya banding like vs like, save vs save - bukan engagement gabungan.</text>
<rect x="28" y="386" width="944" height="34" rx="6" fill="#F2F8FD" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="44" y="408" font-size="12" fill="#141414" text-anchor="start">3. Nyatakan definisi: laporan musti cantumkan versi definisi yang dipakai.</text>
<rect x="28" y="426" width="944" height="34" rx="6" fill="#F2F8FD" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="44" y="448" font-size="12" fill="#141414" text-anchor="start">4. Watch time &amp; save: dua metrik paling berbeda antar platform; catat khusus.</text>
</svg>