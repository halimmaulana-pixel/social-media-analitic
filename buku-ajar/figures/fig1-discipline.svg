cing="0">- Sampling frame &amp; bias</text><text x="640" y="112.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Uji hipotesis &amp; prediksi</text><text x="640" y="127.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Metrik evaluasi adil</text><text x="640" y="141.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Ketidakpastian</text></svg>