<rect x="0" y="0" width="940" height="470" fill="#FFFFFF"/>
<text x="470" y="34" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">Gambar 1. Posisi Social Media Analytics (SMA) dalam peta disiplin</text><text x="470" y="54" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="middle" letter-spacing="0">SMA berada di irisan empat ruang ilmu; tiap disiplin membawa pertanyaan, teori, dan metode yang berbeda</text><circle cx="320" cy="310" r="150" fill="#009E73" stroke="#009E73" stroke-width="1.6" opacity="0.13"/><circle cx="620" cy="310" r="150" fill="#D55E00" stroke="#D55E00" stroke-width="1.6" opacity="0.13"/><circle cx="410" cy="140" r="135" fill="#0072B2" stroke="#0072B2" stroke-width="1.6" opacity="0.13"/><circle cx="590" cy="130" r="130" fill="#F0E442" stroke="#F0E442" stroke-width="1.6" opacity="0.13"/><text x="318" y="190" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#0A5C46" font-weight="bold" text-anchor="middle" letter-spacing="0">Ilmu Komunikasi</text><text x="318" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#0A5C46" font-weight="normal" text-anchor="middle" letter-spacing="0">framing, opini publik,</text><text x="318" y="223" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#0A5C46" font-weight="normal" text-anchor="middle" letter-spacing="0">agenda setting, efek media</text><text x="690" y="190" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#8A3D00" font-weight="bold" text-anchor="middle" letter-spacing="0">Riset Pasar &amp; Marketing</text><text x="690" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#8A3D00" font-weight="normal" text-anchor="middle" letter-spacing="0">social listening, brand health,</text><text x="690" y="223" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#8A3D00" font-weight="normal" text-anchor="middle" letter-spacing="0">comms planning</text><text x="370" y="130" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#0A4C7A" font-weight="bold" text-anchor="middle" letter-spacing="0">Ilmu Komputer / NLP</text><text x="370" y="148" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#0A4C7A" font-weight="normal" text-anchor="middle" letter-spacing="0">klasifikasi teks, topic model,</text><text x="370" y="163" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#0A4C7A" font-weight="normal" text-anchor="middle" letter-spacing="0">graf interaksi, LLM</text><text x="640" y="130" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#7A6A00" font-weight="bold" text-anchor="middle" letter-spacing="0">Statistika &amp; Pembelajaran Mesin</text><text x="640" y="148" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#7A6A00" font-weight="normal" text-anchor="middle" letter-spacing="0">inferensi, prediksi, evaluasi,</text><text x="640" y="163" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#7A6A00" font-weight="normal" text-anchor="middle" letter-spacing="0">validitas &amp; reliabilitas</text><rect x="362" y="212" width="216" height="84" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2.2" opacity="1.0"/><text x="470" y="236" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">SOCIAL MEDIA</text><text x="470" y="258" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">ANALYTICS</text><text x="470" y="278" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#555555" font-weight="normal" text-anchor="middle" letter-spacing="0">data platform Bahasa Indonesia + global</text><rect x="60" y="300" width="250" height="120" rx="10" fill="#F3FBF6" stroke="#009E73" stroke-width="1.6" opacity="1.0"/><text x="70" y="322" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">Yang dibawa Komunikasi</text><text x="70" y="338.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Apa yang sedang dibicarakan</text><text x="70" y="352.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Siapa pembicara &amp; framing-nya</text><text x="70" y="367.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Bagaimana narasi menyebar</text><text x="70" y="381.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Dampak opini &amp; agenda</text><rect x="630" y="300" width="250" height="120" rx="10" fill="#FFF7EC" stroke="#D55E00" stroke-width="1.6" opacity="1.0"/><text x="640" y="322" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">Yang dibawa Marketing</text><text x="640" y="338.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Kesehatan merek &amp; kampiye</text><text x="640" y="352.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">- Audiens &amp; segmen</text><text x="640" y="367.0" font-