<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 300' width='980' height='300' role='img' aria-label='Contoh over-cleaning pada kalimat negatif dan jalur perbaikan'><rect x='0' y='0' width='980' height='300' rx='0' fill='#ffffff' stroke='#cbd5e1' stroke-width='1.2'/><text x='490' y='26' font-family='Georgia, serif' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold'>Jebakan membersihkan berlebihan: stopword naif membalik makna</text><text x='30' y='60' font-family='Georgia, serif' font-size='12' fill='#475569' text-anchor='start' font-weight='bold'>Kalimat asli:</text><text x='140' y='60' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='normal'>Kualitas tidak bagus untuk harga segitu</text><text x='30' y='92' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='bold'>Jalur salah (stopword umum Indonesia memuat kata 'tidak'):</text><rect x='30' y='104' width='430' height='100' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='44' y='128' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='normal'>tidak dihapus -&gt; tersisa: kualitas bagus untuk harga segitu</text><text x='44' y='148' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='bold'>pembaca mesin menyimpulkan POSITIF</text><text x='44' y='168' font-family='Georgia, serif' font-size='11' fill='#dc2626' text-anchor='start' font-weight='normal'>padahal ulasan asli NEGATIF</text><text x='44' y='192' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>kesalahan ini lolos karena tidak ada manusia memeriksa sampel</text><text x='510' y='92' font-family='Georgia, serif' font-size='11' fill='#059669' text-anchor='start' font-weight='bold'>Jalur benar:</text><rect x='510' y='104' width='440' height='100' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='524' y='128' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='normal'>kata negasi dipakai ulang sebagai penanda NEGASI</text><text x='524' y='148' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='normal'>tersisa: kualitas NEGASI bagus untuk harga segitu</text><text x='524' y='168' font-family='Georgia, serif' font-size='11' fill='#059669' text-anchor='start' font-weight='bold'>model membaca: ulasan NEGATIF</text><text x='524' y='192' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>stopword khusus analisis dikompilasi, bukan kamus serbaguna</text><rect x='30' y='224' width='920' height='56' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='44' y='246' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='normal'>Aturan praktis: sebelum menghapus kata apa pun dari daftar, tanyakan apakah kata itu mengubah arah kalimat.</text><text x='44' y='268' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>Yang mengubah arah (tidak, belum, jarang, malah) disimpan. Yang hanya mengganjal (yang, di, ke) boleh dihapus.</text></svg>