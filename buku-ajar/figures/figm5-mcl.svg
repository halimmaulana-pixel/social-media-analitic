<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="figm5 contentlibrary">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#4a5568"/></marker>
<marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2f855a"/></marker>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#c53030"/></marker>
</defs>
<style>.t{font-size:16px;fill:#1a202c}.ts{font-size:13px;fill:#2d3748}.tx{font-size:11.5px;fill:#4a5568}.th{font-size:15px;fill:#fff}</style>
<text x="30" y="34" class="t" font-weight="700" font-size="19">Jalur riset lewat Meta Content Library: dari proposal hingga enclave</text>
<text x="30" y="56" class="tx">Contoh konkret kanal ter-gating: tiap panah adalah waktu tunggu, syarat, atau biaya.</text>
<rect x="40" y="96" width="190" height="78" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="1.4"/>
<text x="52" y="120" class="t" text-anchor="start" font-weight="700">Tim riset</text>
<text x="52" y="142" class="tx" text-anchor="start">dosen penanggung</text>
<text x="52" y="159" class="tx" text-anchor="start">jawab + proposal</text>
<rect x="270" y="96" width="190" height="78" rx="8" fill="#fefcbf" stroke="#4a5568" stroke-width="1.4"/>
<text x="282" y="120" class="t" text-anchor="start" font-weight="700">Pendaftaran lembaga</text>
<text x="282" y="142" class="tx" text-anchor="start">verifikasi institusi</text>
<text x="282" y="159" class="tx" text-anchor="start">+ tujuan riset</text>
<rect x="490" y="96" width="190" height="78" rx="8" fill="#fed7d7" stroke="#4a5568" stroke-width="1.4"/>
<text x="502" y="120" class="t" text-anchor="start" font-weight="700">Approval</text>
<text x="502" y="142" class="tx" text-anchor="start">waktu tunggu;</text>
<text x="502" y="159" class="tx" text-anchor="start">berlaku utk lembaga</text>
<rect x="710" y="96" width="190" height="78" rx="8" fill="#fed7d7" stroke="#4a5568" stroke-width="1.4"/>
<text x="722" y="120" class="t" text-anchor="start" font-weight="700">Enclave berbayar</text>
<text x="722" y="142" class="tx" text-anchor="start">query di dalam;</text>
<text x="722" y="159" class="tx" text-anchor="start">ekspor terbatas</text>
<line x1="230" y1="135" x2="270" y2="135" stroke="#4a5568" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="460" y1="135" x2="500" y2="135" stroke="#4a5568" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="680" y1="135" x2="720" y2="135" stroke="#4a5568" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="46" y="210" class="ts" text-anchor="start">Tiga pelajaran dari satu jalur:</text>
<text x="46" y="234" class="ts" text-anchor="start">1. Approval milik LEMBAGA, bukan pribadi — usulkan pendaftaran di minggu pertama semester.</text>
<text x="46" y="258" class="ts" text-anchor="start">2. Enclave: data tidak boleh keluar; hasil yang bisa dibawa umumnya hanya agregat.</text>
<text x="46" y="282" class="ts" text-anchor="start">3. Biaya kelembagaan yang dilaporkan publik 2026 sekitar USD 371 per tim per bulan (verifikasi!).</text>
<text x="46" y="306" class="ts" text-anchor="start">4. Tanpa approval? triangulasi kanal terbuka (Bluesky) dan platform berkuota — dan jujur di memo tentang cakupannya.</text>
<text x="30" y="415" class="tx">Sumber: laporan publik akses riset Meta 2024–2026 (indikatif; verifikasi sebelum dikutip).</text>
</svg>
