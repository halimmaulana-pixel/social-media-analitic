<text x="714" y="126" class="ts" text-anchor="start">Semuanya kanal</text>
<text x="714" y="155" class="ts" text-anchor="start">RESMI.</text>
<text x="714" y="184" class="ts" text-anchor="start">Scraping halaman</text>
