<text x="714" y="329" class="ts" text-anchor="start">risiko hukum</text>
<text x="714" y="358" class="ts" text-anchor="start">sendiri (Bag. 5).</text>
<text x="30" y="415" class="tx">Kuota dan biaya bersifat indikatif — verifikasi ulang tiap semester di halaman resmi platform.</text>
