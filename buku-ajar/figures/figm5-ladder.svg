<text x="30" y="34" class="t" font-weight="700" font-size="19">Tangga akses data media sosial (2026)</text>
<text x="30" y="56" class="tx">Semakin tinggi anak tangga: hak akses lebih luas, kuota makin longgar — namun biaya dan tuntutan tahap opsi besar makin tinggi.</text>
