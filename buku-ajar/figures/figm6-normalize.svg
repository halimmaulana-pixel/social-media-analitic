<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 400' width='980' height='400' role='img' aria-label='Worked example normalisasi komentar marketplace enam langkah'><rect x='0' y='0' width='980' height='400' rx='0' fill='#ffffff' stroke='#cbd5e1' stroke-width='1.2'/><text x='490' y='26' font-family='Georgia, serif' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold'>Contoh nyata: satu baris komentar marketplace, enam langkah jadi token bersih</text><text x='30' y='56' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='italic'>Mentah: barangnya bagus bjrr, pengiriman cepat, tapi packing'e abis bangkeett 💔 Recommended deh!! @TokoA #belanjakan #murah</text><rect x='30' y='68' width='250' height='46' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='42' y='84' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>1. Pisah elemen non-teks</text><rect x='292' y='68' width='250' height='46' rx='6' fill='#f1f5f9' stroke='#cbd5e1' stroke-width='1.2'/><text x='302' y='84' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>hapus @mention, pisahkan</text><text x='302' y='96' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>#tagar, emoji ditandai token</text><text x='302' y='108' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>EMI_PLOSI</text><rect x='556' y='68' width='394' height='46' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='566' y='84' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>barangnya bagus bjr pengiriman cepat tapi</text><text x='566' y='96' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>packinge abis bangkeett EMI_PLOSI Recommended</text><text x='566' y='108' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>deh TAGAR_BELANJAKAN TAGAR_MURAH</text><rect x='30' y='120' width='250' height='46' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='42' y='136' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>2. Rapikan huruf panjang</text><rect x='292' y='120' width='250' height='46' rx='6' fill='#f1f5f9' stroke='#cbd5e1' stroke-width='1.2'/><text x='302' y='136' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>bangkeett menjadi banget</text><text x='302' y='148' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>(aturan: huruf berulang lebih</text><text x='302' y='160' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>dari dua kali dipangkas)</text><rect x='556' y='120' width='394' height='46' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='566' y='136' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>barangnya bagus bjrr pengiriman cepat tapi</text><text x='566' y='148' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>packinge abis banget EMI_PLOSI Recommended deh</text><text x='566' y='160' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>...</text><rect x='30' y='172' width='250' height='46' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='42' y='188' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>3. Ganti slang lewat kamus</text><rect x='292' y='172' width='250' height='46' rx='6' fill='#f1f5f9' stroke='#cbd5e1' stroke-width='1.2'/><text x='302' y='188' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>bjb jadi bagus, bjrr jadi bagus</text><text x='302' y='200' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>banget, deh jadi partikel, tuh</text><text x='302' y='212' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>dipertahankan bila menunjuk</text><rect x='556' y='172' width='394' height='46' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='566' y='188' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>barangnya bagus bagus banget pengiriman cepat</text><text x='566' y='200' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>tapi packing china abis banget ...</text><rect x='30' y='224' width='250' height='46' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='42' y='240' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>4. Pecah tagar majemuk</text><rect x='292' y='224' width='250' height='46' rx='6' fill='#f1f5f9' stroke='#cbd5e1' stroke-width='1.2'/><text x='302' y='240' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>#belanjakan menjadi belanja</text><text x='302' y='252' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>akan, #murah tetap murah</text><rect x='556' y='224' width='394' height='46' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='566' y='240' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>TAGAR_BELANJAKAN -&gt; token belanja, akan</text><rect x='30' y='276' width='250' height='46' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='42' y='292' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>5. Beri tanda negasi</text><rect x='292' y='276' width='250' height='46' rx='6' fill='#f1f5f9' stroke='#cbd5e1' stroke-width='1.2'/><text x='302' y='292' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>tapi membuka klausa negatif,</text><text x='302' y='304' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>packinge abis dikontraskan</text><text x='302' y='316' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>dengan bagus</text><rect x='556' y='276' width='394' height='46' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='566' y='292' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>flag NEGASI aktif sampai tanda baca berikutnya</text><rect x='30' y='328' width='250' height='46' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='42' y='344' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>6. Simpan bentuk asli</text><rect x='292' y='328' width='250' height='46' rx='6' fill='#f1f5f9' stroke='#cbd5e1' stroke-width='1.2'/><text x='302' y='344' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>kolom teks_mentah tak pernah</text><text x='302' y='356' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>dihapus, hanya kolom</text><text x='302' y='368' font-family='Georgia, serif' font-size='9' fill='#475569' text-anchor='start' font-weight='normal'>teks_bersih yang berubah</text><rect x='556' y='328' width='394' height='46' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='566' y='344' font-family='Georgia, serif' font-size='9' fill='#1e293b' text-anchor='start' font-weight='normal'>audit dapat dibuka kembali kapan saja</text><text x='30' y='404' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>Hasil akhir: [barangnya] [bagus] [bagus] [banget] [pengiriman] [cepat] [NEGASI] [packing] [china] [abis] [banget] [EMI_PLOSI] [TAGAR_BELANJAKAN]</text><text x='30' y='422' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Tanda NEGASI penting untuk langkah selanjutnya. Model sentimen di pertemuan 9 membaca penanda ini agar tidak salah simpul.</text></svg>