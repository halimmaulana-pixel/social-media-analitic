<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 420' width='980' height='420' role='img' aria-label='Peta hubungan enam materi sebelum UTS'><rect x='0' y='0' width='980' height='420' rx='0' fill='#ffffff' stroke='#cbd5e1' stroke-width='1.2'/><text x='490' y='28' font-family='Georgia, serif' font-size='16' fill='#1e293b' text-anchor='middle' font-weight='bold'>Peta hubungan enam materi sebelum UTS</text><text x='490' y='48' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='middle' font-weight='normal'>Bacaan dari kiri atas ke kanan bawah: fondasi, lalu akses, lalu kualitas data</text><rect x='60' y='80' width='380' height='100' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='74' y='106' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Materi 1</text><text x='74' y='123' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Fondasi SMA</text><text x='74' y='144' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>siklus data,</text><text x='74' y='158' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>maturitas analitik,</text><text x='74' y='172' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>unit analisis</text><rect x='300' y='80' width='380' height='100' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='314' y='106' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Materi 2</text><text x='314' y='123' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Ekosistem</text><text x='314' y='144' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>affordance, feed =</text><text x='314' y='158' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>sampling frame, tangga</text><text x='314' y='172' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>akses 2026</text><rect x='540' y='80' width='380' height='100' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='554' y='106' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Materi 3</text><text x='554' y='123' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Jenis data</text><text x='554' y='144' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>5 keluarga data,</text><text x='554' y='158' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>field dictionary,</text><text x='554' y='172' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>granularitas</text><rect x='540' y='210' width='380' height='100' rx='10' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='554' y='236' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Materi 4</text><text x='554' y='253' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Akuisisi API</text><text x='554' y='274' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>pagination, rate limit,</text><text x='554' y='288' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>checksum, collection</text><text x='554' y='302' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>log</text><rect x='300' y='210' width='380' height='100' rx='10' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='314' y='236' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Materi 5</text><text x='314' y='253' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Akses &amp; legalitas</text><text x='314' y='274' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>gated access, scraping,</text><text x='314' y='288' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>UU PDP, GDPR,</text><text x='314' y='302' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>feasibility memo</text><rect x='60' y='210' width='380' height='100' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='74' y='236' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Materi 6</text><text x='74' y='253' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>Preprocessing</text><text x='74' y='274' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>dedup, bot heuristik,</text><text x='74' y='288' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>normalisasi, cleaning</text><text x='74' y='302' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>log</text><rect x='300' y='340' width='380' height='100' rx='10' fill='#f1f5f9' stroke='#cbd5e1' stroke-width='1.2'/><text x='314' y='366' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>CPMK-2 teruji: koleksi bersih,</text><text x='314' y='383' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>lapor terdokumentasi, keputusan</text><text x='314' y='400' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='bold'>jalur data bisa dipertanggungjawabkan</text><text x='314' y='421' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'></text><line x1='440' y1='130' x2='540' y2='130' stroke='#2563eb' stroke-width='1.5'/><polygon points='540.0,130.0 531.8,133.7 531.8,126.3' fill='#2563eb'/><line x1='710' y1='130' x2='710' y2='210' stroke='#2563eb' stroke-width='1.5'/><polygon points='710.0,210.0 706.3,201.8 713.7,201.8' fill='#2563eb'/><line x1='540' y1='260' x2='440' y2='260' stroke='#2563eb' stroke-width='1.5'/><polygon points='440.0,260.0 448.2,256.3 448.2,263.7' fill='#2563eb'/><line x1='300' y1='260' x2='200' y2='260' stroke='#2563eb' stroke-width='1.5'/><polygon points='200.0,260.0 208.2,256.3 208.2,263.7' fill='#2563eb'/><line x1='190' y1='310' x2='370' y2='340' stroke='#2563eb' stroke-width='1.5'/><polygon points='370.0,340.0 361.3,342.3 362.5,335.0' fill='#2563eb'/><text x='510' y='118' font-family='Georgia, serif' font-size='10' fill='#2563eb' text-anchor='middle' font-weight='bold'>lanjut</text><text x='722' y='175' font-family='Georgia, serif' font-size='10' fill='#2563eb' text-anchor='start' font-weight='normal'>data mentah</text><text x='530' y='275' font-family='Georgia, serif' font-size='10' fill='#059669' text-anchor='middle' font-weight='bold'>keputusan jalur</text><text x='290' y='275' font-family='Georgia, serif' font-size='10' fill='#d97706' text-anchor='middle' font-weight='bold'>bersihkan dahulu</text><text x='60' y='380' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>Setiap kotak adalah satu pertemuan. Tiap panah adalah ketergantungan: Materi 4 memakai kamus field dari Materi 3,</text><text x='60' y='398' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>Materi 6 memakai collection log dari Materi 4, dan Materi 5 menjadi filter sebelum keduanya dijalankan.</text></svg>