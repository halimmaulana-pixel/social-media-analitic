<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="figm4 collectionlog" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#141414"/></marker></defs>
<text x="22" y="30" font-size="15" fill="#0072B2" font-weight="bold" text-anchor="start">Collection log — bukti koleksi, bukan laporan akhir</text>
<text x="22" y="52" font-size="12.5" fill="#5A5A5A" text-anchor="start">Fungsi: membebaskan memori; menegakkan konsistensi antar run; mata-mata atas silent truncation.</text>
<rect x="30" y="54" width="940" height="26" rx="4" fill="#E9EEF4" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="44" y="72" font-size="12.5" fill="#0072B2" font-weight="bold" text-anchor="start">Field</text>
<text x="260" y="72" font-size="12.5" fill="#0072B2" font-weight="bold" text-anchor="start">Contoh isi (run nyata di lab)</text>
<text x="672" y="72" font-size="12.5" fill="#0072B2" font-weight="bold" text-anchor="start">Fungsi</text>
<rect x="30" y="76" width="940" height="37" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="99" font-size="12.5" fill="#7A4FA0" text-anchor="start">run_id</text>
<text x="260" y="91" font-size="12" fill="#141414" text-anchor="start">run02</text>
<text x="672" y="91" font-size="11.5" fill="#5A5A5A" text-anchor="start">identitas run; idempoten (ulang run menimpa</text>
<text x="672" y="107" font-size="11.5" fill="#5A5A5A" text-anchor="start">id sama)</text>
<rect x="30" y="113" width="940" height="37" rx="8" fill="#FAFBFC" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="136" font-size="12.5" fill="#7A4FA0" text-anchor="start">platform + endpoint</text>
<text x="260" y="128" font-size="12" fill="#141414" text-anchor="start">X API v2 · /2/tweets/search/recent</text>
<text x="672" y="128" font-size="11.5" fill="#5A5A5A" text-anchor="start">versi API dicantumkan — docs berubah per</text>
<text x="672" y="144" font-size="11.5" fill="#5A5A5A" text-anchor="start">bulan</text>
<rect x="30" y="150" width="940" height="37" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="173" font-size="12.5" fill="#7A4FA0" text-anchor="start">auth mode</text>
<text x="260" y="165" font-size="12" fill="#141414" text-anchor="start">app-only bearer</text>
<text x="672" y="165" font-size="11.5" fill="#5A5A5A" text-anchor="start">bearer / oauth2 / app-password</text>
<rect x="30" y="187" width="940" height="37" rx="8" fill="#FAFBFC" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="210" font-size="12.5" fill="#7A4FA0" text-anchor="start">sampling frame</text>
<text x="260" y="202" font-size="12" fill="#141414" text-anchor="start">keyword (#BapakKantor OR kata kunci</text>
<text x="260" y="218" font-size="12" fill="#141414" text-anchor="start">tokoh) window 7 hari</text>
<text x="672" y="202" font-size="11.5" fill="#5A5A5A" text-anchor="start">query string utuh + rentang waktu UTC</text>
<rect x="30" y="224" width="940" height="37" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="247" font-size="12.5" fill="#7A4FA0" text-anchor="start">mulai–selesai (UTC+WIB)</text>
<text x="260" y="239" font-size="12" fill="#141414" text-anchor="start">2026-11-03 00:00Z ↔ 07:00 WIB</text>
<text x="672" y="239" font-size="11.5" fill="#5A5A5A" text-anchor="start">dua zona berdampingan — tidak boleh dicampur</text>
<text x="672" y="255" font-size="11.5" fill="#5A5A5A" text-anchor="start">diam-diam</text>
<rect x="30" y="261" width="940" height="37" rx="8" fill="#FAFBFC" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="284" font-size="12.5" fill="#7A4FA0" text-anchor="start">pages / post</text>
<text x="260" y="276" font-size="12" fill="#141414" text-anchor="start">45 halaman · 3.120 post mentah</text>
<text x="672" y="276" font-size="11.5" fill="#5A5A5A" text-anchor="start">jika bulat selerusnya (200/200/…) → curiga</text>
<text x="672" y="292" font-size="11.5" fill="#5A5A5A" text-anchor="start">truncation</text>
<rect x="30" y="298" width="940" height="37" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="321" font-size="12.5" fill="#7A4FA0" text-anchor="start">filter aktif</text>
<text x="260" y="313" font-size="12" fill="#141414" text-anchor="start">exclude retweet; exclude tombol</text>
<text x="260" y="329" font-size="12" fill="#141414" text-anchor="start">query promosi</text>
<text x="672" y="313" font-size="11.5" fill="#5A5A5A" text-anchor="start">setiap filter platform dicantumkan — ia ikut</text>
<text x="672" y="329" font-size="11.5" fill="#5A5A5A" text-anchor="start">membentuk sampel</text>
<rect x="30" y="335" width="940" height="37" rx="8" fill="#FAFBFC" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="358" font-size="12.5" fill="#7A4FA0" text-anchor="start">dedup &amp; jendela</text>
<text x="260" y="350" font-size="12" fill="#141414" text-anchor="start">by post_id; kap waktu kiri-inklusif</text>
<text x="672" y="350" font-size="11.5" fill="#5A5A5A" text-anchor="start">dedup across window; tepi jendela tak dobel</text>
<rect x="30" y="372" width="940" height="37" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="395" font-size="12.5" fill="#7A4FA0" text-anchor="start">file + checksum</text>
<text x="260" y="387" font-size="12" fill="#141414" text-anchor="start">raw_w03_part00.jsonl …  shasum256s 4</text>
<text x="260" y="403" font-size="12" fill="#141414" text-anchor="start">file</text>
<text x="672" y="387" font-size="11.5" fill="#5A5A5A" text-anchor="start">file raw di arsip; hash disimpan berdekatan</text>
<rect x="30" y="409" width="940" height="37" rx="8" fill="#FAFBFC" stroke="#D9D9D9" stroke-width="1"/>
<text x="44" y="432" font-size="12.5" fill="#7A4FA0" text-anchor="start">kuota</text>
<text x="260" y="424" font-size="12" fill="#141414" text-anchor="start">19.4k/20.000 post terpakai</text>
<text x="672" y="424" font-size="11.5" fill="#5A5A5A" text-anchor="start">run berikutnya harus tahu sisa anggaran</text>
<text x="30" y="472" font-size="12.5" fill="#009E73" text-anchor="start">Reviewer menilai collection log dulu, baru dataset: log yang baik membuat dataset bisa direproduksi tanpa bertanya.</text>
</svg>