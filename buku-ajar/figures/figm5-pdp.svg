<style>.t{font-size:16px;fill:#1a202c}.ts{font-size:13px;fill:#2d3748}.tx{font-size:11.5px;fill:#4a5568}.th{font-size:15px;fill:#fff}</style>
<text x="30" y="34" class="t" font-weight="700" font-size="19">Satu post, dua klaster field — pelindungan data pribadi (UU PDP 27/2022)</text>
<text x="30" y="56" class="tx">Pembeda utamanya adalah 'dapat diidentifikasi', bukan status privasi akun.</text>
<rect x="30" y="84" width="430" height="296" rx="8" fill="#f0fdf4" stroke="#2f855a" stroke-width="1.4"/>
