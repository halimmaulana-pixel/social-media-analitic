<rect x="52" y="132" width="386" height="34" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.4"/>
<text x="66" y="154" class="ts" text-anchor="start">isi teks post (dipublikasikan akun sendiri)</text>
<rect x="52" y="173" width="386" height="34" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.4"/>
<text x="66" y="195" class="ts" text-anchor="start">id post / id media (tanpa identitas akun)</text>
<rect x="52" y="214" width="386" height="34" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.4"/>
<text x="66" y="236" class="ts" text-anchor="start">metrik agregat: jumlah suka, replikasi</text>
<rect x="52" y="255" width="386" height="34" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.4"/>
<text x="66" y="277" class="ts" text-anchor="start">waktu posting (UTC)</text>
<rect x="52" y="296" width="386" height="34" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.4"/>
<text x="66" y="318" class="ts" text-anchor="start">label bahasa dari platform</text>
<rect x="52" y="337" width="386" height="34" rx="6" fill="#ffffff" stroke="#c6f6d5" stroke-width="1.4"/>
<text x="66" y="359" class="ts" text-anchor="start">jenis konten: teks / gambar / video</text>
<rect x="480" y="84" width="430" height="296" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.4"/>
<text x="502" y="112" class="t" text-anchor="start" font-weight="700" fill="#c53030">Perlu mitigasi / tidak dibagikan</text>
<rect x="502" y="132" width="386" height="34" rx="6" fill="#ffffff" stroke="#fed7d7" stroke-width="1.4"/>
<text x="516" y="154" class="ts" text-anchor="start">nama tampilan + user_id akun</text>
<rect x="502" y="173" width="386" height="34" rx="6" fill="#ffffff" stroke="#fed7d7" stroke-width="1.4"/>
<text x="516" y="195" class="ts" text-anchor="start">foto profil wajah (data biometrik)</text>
<rect x="502" y="214" width="386" height="34" rx="6" fill="#ffffff" stroke="#fed7d7" stroke-width="1.4"/>
<text x="516" y="236" class="ts" text-anchor="start">bio: pekerjaan, kota presisi, sekolah</text>
<rect x="502" y="255" width="386" height="34" rx="6" fill="#ffffff" stroke="#fed7d7" stroke-width="1.4"/>
<text x="516" y="277" class="ts" text-anchor="start">kontak yang dipaparkan di bio</text>
<rect x="502" y="296" width="386" height="34" rx="6" fill="#ffffff" stroke="#fed7d7" stroke-width="1.4"/>
<text x="516" y="318" class="ts" text-anchor="start">jaringan follower/following yang memetakan</text>
<rect x="502" y="337" width="386" height="34" rx="6" fill="#ffffff" stroke="#fed7d7" stroke-width="1.4"/>
<text x="516" y="359" class="ts" text-anchor="start">label kategori sensitif lainnya</text>
<text x="30" y="415" class="tx">Anonimisasi bukan menghapus nama saja: kombinasi field kecil pun dapat mengembalikan identitas (re-identification).</text>
