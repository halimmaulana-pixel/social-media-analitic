<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 330' width='980' height='330' role='img' aria-label='Contoh dedup dekat dengan shingle tiga kata dan skor kemiripan'><rect x='0' y='0' width='980' height='330' rx='0' fill='#ffffff' stroke='#cbd5e1' stroke-width='1.2'/><text x='490' y='26' font-family='Georgia, serif' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold'>Dedup dekat: dua tweet yang mirip 71 persen, apakah opini yang sama?</text><text x='30' y='58' font-family='Georgia, serif' font-size='12' fill='#2563eb' text-anchor='start' font-weight='bold'>Tweet A (asli):</text><text x='140' y='58' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='normal'>Pemda lamban tangani banjir, warga sampai mengungsi ke masjid</text><text x='30' y='84' font-family='Georgia, serif' font-size='12' fill='#2563eb' text-anchor='start' font-weight='bold'>Tweet B (reshare):</text><text x='140' y='84' font-family='Georgia, serif' font-size='12' fill='#1e293b' text-anchor='start' font-weight='normal'>Pemda lamban tangani banjir, warga terpaksa mengungsi ke masjid Agung</text><text x='30' y='112' font-family='Georgia, serif' font-size='12' fill='#475569' text-anchor='start' font-weight='bold'>Shingle 3 kata:</text><rect x='30' y='125' width='300' height='20' rx='4' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='38' y='139' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>pemda lamban tangani</text><rect x='350' y='125' width='330' height='20' rx='4' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/><text x='358' y='139' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>pemda lamban tangani</text><text x='700' y='139' font-family='Georgia, serif' font-size='10' fill='#059669' text-anchor='start' font-weight='bold'>sama</text><rect x='30' y='149' width='300' height='20' rx='4' fill='#d1fae5' stroke='#059669