fill='#1e293b' text-anchor='start' font-weight='normal'>warga sampai mengungsi</text><rect x='350' y='221' width='330' height='20' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='358' y='235' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>warga terpaksa mengungsi</text><text x='700' y='235' font-family='Georgia, serif' font-size='10' fill='#dc2626' text-anchor='start' font-weight='bold'>beda</text><rect x='30' y='245' width='300' height='20' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='38' y='259' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>sampai mengungsi ke</text><rect x='350' y='245' width='330' height='20' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='358' y='259' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>terpaksa mengungsi ke</text><text x='700' y='259' font-family='Georgia, serif' font-size='10' fill='#dc2626' text-anchor='start' font-weight='bold'>beda</text><rect x='30' y='269' width='300' height='20' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='38' y='283' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>mengungsi ke masjid</text><rect x='350' y='269' width='330' height='20' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='1.2'/><text x='358' y='283' font-family='Georgia, serif' font-size='10' fill='#1e293b' text-anchor='start' font-weight='normal'>mengungsi ke masjid agung</text><text x='700' y='283' font-family='Georgia, serif' font-size='10' fill='#dc2626' text-anchor='start' font-weight='bold'>beda</text><text x='30' y='318' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>MinHash memperkirakan kemiripan dari potongan 3 kata yang bertumpang tindih.</text><text x='30' y='336' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>LSH mencari pasangan yang layak diperiksa, sehingga 500 ribu tweet tidak perlu dibandingkan satu per satu.</text><rect x='30' y='354' width='900' height='58' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='44' y='374' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='normal'>Keputusan: 5 dari 7 potongan sama, skor 0,71 di atas ambang 0,60, keduanya ditandai duplikat.</text><text x='44' y='398' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>Catatan: jika Tweet B menambahkan klaim baru (video, lokasi baru), ia bukan duplikat. Tanda, lalu periksa isi sebelum membuang.</text></svg>