<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="figm3 taxonomy" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#141414"/></marker></defs>
<rect x="10" y="46" width="980" height="534" rx="14" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="22" y="30" font-size="15" fill="#0072B2" font-weight="bold" text-anchor="start">Taksonomi unit data media sosial - lima keluarganya</text>
<rect x="418" y="62" width="164" height="40" rx="10" fill="#0072B2" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="500" y="88" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SATU POST</text>
<line x1="500" y1="102" x2="114" y2="148" stroke="#0072B2" stroke-width="1.4"/>
<rect x="24" y="148" width="180" height="224" rx="8" fill="#F2F8FD" stroke="#0072B2" stroke-width="1.8"/>
<text x="36" y="174" font-size="13" fill="#0072B2" font-weight="bold" text-anchor="start">TEKS</text>
<text x="36" y="202" font-size="11.5" fill="#141414" text-anchor="start">- isi post &amp; caption</text>
<text x="36" y="234" font-size="11.5" fill="#141414" text-anchor="start">- hashtag &amp; mention</text>
<text x="36" y="266" font-size="11.5" fill="#141414" text-anchor="start">- sarkasme &amp; emoji</text>
<line x1="500" y1="102" x2="114" y2="148" stroke="#0072B2" stroke-width="1.4"/>
<line x1="500" y1="102" x2="310" y2="148" stroke="#D55E00" stroke-width="1.4"/>
<rect x="220" y="148" width="180" height="224" rx="8" fill="#FDF1EA" stroke="#D55E00" stroke-width="1.8"/>
<text x="232" y="174" font-size="13" fill="#D55E00" font-weight="bold" text-anchor="start">MEDIA</text>
<text x="232" y="202" font-size="11.5" fill="#141414" text-anchor="start">- frame video utama</text>
<text x="232" y="234" font-size="11.5" fill="#141414" text-anchor="start">- teks on-screen (OCR)</text>
<text x="232" y="266" font-size="11.5" fill="#141414" text-anchor="start">- audio (transkrip)</text>
<line x1="500" y1="102" x2="310" y2="148" stroke="#D55E00" stroke-width="1.4"/>
<line x1="500" y1="102" x2="506" y2="148" stroke="#009E73" stroke-width="1.4"/>
<rect x="416" y="148" width="180" height="224" rx="8" fill="#F1FAF5" stroke="#009E73" stroke-width="1.8"/>
<text x="428" y="174" font-size="13" fill="#009E73" font-weight="bold" text-anchor="start">INTERAKSI</text>
<text x="428" y="202" font-size="11.5" fill="#141414" text-anchor="start">- like / suka</text>
<text x="428" y="234" font-size="11.5" fill="#141414" text-anchor="start">- komentar / reply</text>
<text x="428" y="266" font-size="11.5" fill="#141414" text-anchor="start">- share / save</text>
<line x1="500" y1="102" x2="506" y2="148" stroke="#009E73" stroke-width="1.4"/>
<line x1="500" y1="102" x2="702" y2="148" stroke="#7A4FA0" stroke-width="1.4"/>
<rect x="612" y="148" width="180" height="224" rx="8" fill="#F7F2FC" stroke="#7A4FA0" stroke-width="1.8"/>
<text x="624" y="174" font-size="13" fill="#7A4FA0" font-weight="bold" text-anchor="start">METADATA</text>
<text x="624" y="202" font-size="11.5" fill="#141414" text-anchor="start">- timestamp UTC &amp; lokal</text>
<text x="624" y="234" font-size="11.5" fill="#141414" text-anchor="start">- lokasi (bila ada)</text>
<text x="624" y="266" font-size="11.5" fill="#141414" text-anchor="start">- bahasa &amp; perangkat</text>
<line x1="500" y1="102" x2="702" y2="148" stroke="#7A4FA0" stroke-width="1.4"/>
<line x1="500" y1="102" x2="898" y2="148" stroke="#9B2C2C" stroke-width="1.4"/>
<rect x="808" y="148" width="180" height="224" rx="8" fill="#FBE9E9" stroke="#9B2C2C" stroke-width="1.8"/>
<text x="820" y="174" font-size="13" fill="#9B2C2C" font-weight="bold" text-anchor="start">LOG ENGAGEMENT</text>
<text x="820" y="202" font-size="11.5" fill="#141414" text-anchor="start">- watch time &amp;</text>
<text x="820" y="217" font-size="11.5" fill="#141414" text-anchor="start">completion</text>
<text x="820" y="234" font-size="11.5" fill="#141414" text-anchor="start">- urutan frame ditonton</text>
<text x="820" y="266" font-size="11.5" fill="#141414" text-anchor="start">- klik notifikasi</text>
<line x1="500" y1="102" x2="898" y2="148" stroke="#9B2C2C" stroke-width="1.4"/>
<rect x="24" y="404" width="944" height="108" rx="8" fill="#F2F8FD" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="40" y="432" font-size="12.5" fill="#141414" text-anchor="start">Moral: lima keluarga data hadir dalam SATU objek post. Analisis multimodal = menggabungkan</text>
<text x="40" y="454" font-size="12.5" fill="#141414" text-anchor="start">semua keluarga atas berdasarkan post ID yang sama - bukan lima tabel yang biak tanpa tautan.</text>
<text x="40" y="476" font-size="12.5" fill="#141414" text-anchor="start">Praktik juga aman: simpan mentah JSON utuh (audit), lalu ekstrak field di kamus field (efisien).</text>
<text x="24" y="560" font-size="12" fill="#5A5A5A" text-anchor="start">Aliran data post = input beberapa kelompok metode (NLP untuk teks, CV untuk frame, timeseries untuk watch time)</text>
<text x="24" y="580" font-size="12" fill="#5A5A5A" text-anchor="start">karena post yang sama bisa ditanya beragam pertanyaan.</text>
</svg>