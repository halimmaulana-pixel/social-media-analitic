<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" role="img" aria-label="Unit analisis dalam Social Media Analytics" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4D4D4D"/></marker></defs>
<rect x="0" y="0" width="1000" height="430" fill="#FFFFFF"/>
<text x="500" y="30" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">Gambar 4. Unit analisis menentukan pertanyaan yang bisa dijawab</text><text x="500" y="50" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="middle" letter-spacing="0">Dari kelompok besar ke individu; setiap turun satu tingkat menambah kolom data tetapi menyempitkan generalisasi</text><rect x="30" y="66" width="176" height="70" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.8" opacity="1.0"/><text x="42" y="86" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#0072B2" font-weight="bold" text-anchor="start" letter-spacing="0">PLATFORM / EKOSISTEM</text><text x="42" y="102" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Perbandingan lintas platform</text><text x="42" y="118" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Adakah perbedaan narasi antar aplikasi?</text><text x="42" y="131" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Platform mana yang layak diaudit rutin?</text><line x1="208" y1="100" x2="218" y2="100" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="220" y="66" width="176" height="70" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="1.8" opacity="1.0"/><text x="232" y="86" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#009E73" font-weight="bold" text-anchor="start" letter-spacing="0">CONVERSASI / KAMPANYE</text><text x="232" y="102" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Thread, tagar, topik, batch</text><text x="232" y="118" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Bagaimana isu X berkembang 7 hari?</text><text x="232" y="131" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Topik apa yang muncul pasca peristiwa?</text><line x1="398" y1="100" x2="408" y2="100" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="410" y="66" width="176" height="70" rx="10" fill="#FFFFFF" stroke="#F0E442" stroke-width="1.8" opacity="1.0"/><text x="422" y="86" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#F0E442" font-weight="bold" text-anchor="start" letter-spacing="0">POST / KONTEN</text><text x="422" y="102" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Teks, gambar, video + metrik</text><text x="422" y="118" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Format apa yang paling disimpan?</text><text x="422" y="131" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Hook seperti apa menahan penonton?</text><line x1="588" y1="100" x2="598" y2="100" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="600" y="66" width="176" height="70" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.8" opacity="1.0"/><text x="612" y="86" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#D55E00" font-weight="bold" text-anchor="start" letter-spacing="0">PENGGUNA / AKUN</text><text x="612" y="102" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Profil, riwayat, demografi terinferensi</text><text x="612" y="118" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Siapa pembicara teraktif &amp; apa latarnya?</text><text x="612" y="131" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Akun mana yang tampak otomatis?</text><line x1="778" y1="100" x2="788" y2="100" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="790" y="66" width="176" height="70" rx="10" fill="#FFFFFF" stroke="#7A4FA0" stroke-width="1.8" opacity="1.0"/><text x="802" y="86" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#7A4FA0" font-weight="bold" text-anchor="start" letter-spacing="0">JARINGAN / KOMUNITAS</text><text x="802" y="102" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Graf ikut-ikuti, balas, sebut, ko-unggah</text><text x="802" y="118" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Siapa jembatan antar kubu?</text><text x="802" y="131" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.2" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">• Adakah klaster terkoordinasi?</text><text x="500" y="168" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">Contoh satu unit data — satu post TikTok/X — dapat diurai menjadi komponen berikut:</text><rect x="40" y="180" width="920" height="200" rx="10" fill="#FBFBFD" stroke="#8C8C8C" stroke-width="1.4" opacity="1.0"/><text x="54" y="202" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">Anatomi satu post: empat lapis data</text><rect x="56" y="208" width="190" height="26" rx="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.4" opacity="1.0"/><text x="62" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#0072B2" font-weight="bold" text-anchor="start" letter-spacing="0">Lapis 1 — Isi (content)</text><text x="258" y="224" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Teks, transkrip audio, teks on-screen (OCR), objek terlihat (CLIP), label &amp; mention</text><rect x="56" y="244" width="190" height="26" rx="6" fill="#FFFFFF" stroke="#009E73" stroke-width="1.4" opacity="1.0"/><text x="62" y="260" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#009E73" font-weight="bold" text-anchor="start" letter-spacing="0">Lapis 2 — Metadata</text><text x="258" y="260" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Waktu, zona waktu, bahasa, lokasi, perangkat, jumlah follower, status verifikasi</text><rect x="56" y="280" width="190" height="26" rx="6" fill="#FFFFFF" stroke="#F0E442" stroke-width="1.4" opacity="1.0"/><text x="62" y="296" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#F0E442" font-weight="bold" text-anchor="start" letter-spacing="0">Lapis 3 — Interaksi (engagement)</text><text x="258" y="296" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Like, komentar, share, save, watch time, completion rate, klik profil</text><rect x="56" y="316" width="190" height="26" rx="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.4" opacity="1.0"/><text x="62" y="332" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#D55E00" font-weight="bold" text-anchor="start" letter-spacing="0">Lapis 4 — Relasi</text><text x="258" y="332" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Reply ke post siapa, mention siapa, bagian dari graf follow/co-post</text></svg>