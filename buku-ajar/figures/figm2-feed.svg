<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="figm2 feed" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#141414"/></marker></defs>
<rect x="10" y="46" width="980" height="404" rx="14" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="22" y="30" font-size="15" fill="#0072B2" font-weight="bold" text-anchor="start">Tiga logika feed - dan sampel data yang dihasilkannya</text>
<rect x="28" y="66" width="296" height="230" rx="8" fill="#F1FAF5" stroke="#009E73" stroke-width="1.8"/>
<text x="44" y="92" font-size="14" fill="#009E73" font-weight="bold" text-anchor="start">KRONOLOGIS</text>
<text x="44" y="122" font-size="12.5" fill="#141414" text-anchor="start">Post mengikuti urutan waktu murni</text>
<line x1="44" y1="150" x2="306" y2="150" stroke="#D9D9D9" stroke-width="1.4"/>
<text x="44" y="176" font-size="12" fill="#141414" text-anchor="start">Sampel: apa saja yang tayang dalam</text>
<text x="44" y="192" font-size="12" fill="#141414" text-anchor="start">jendela waktu; waktu ukur yang jujur.</text>
<text x="44" y="240" font-size="11.5" fill="#5A5A5A" text-anchor="start">Pakai untuk:</text>
<text x="44" y="262" font-size="12" fill="#009E73" font-weight="bold" text-anchor="start">Cocok untuk: kecepatan sebaran per jam</text>
<rect x="350" y="66" width="296" height="230" rx="8" fill="#F7F2FC" stroke="#7A4FA0" stroke-width="1.8"/>
<text x="366" y="92" font-size="14" fill="#7A4FA0" font-weight="bold" text-anchor="start">FOLLOW-GRAPH</text>
<text x="366" y="122" font-size="12.5" fill="#141414" text-anchor="start">Post terbatas pada jaringan follow</text>
<text x="366" y="138" font-size="12.5" fill="#141414" text-anchor="start">pengguna</text>
<line x1="366" y1="150" x2="628" y2="150" stroke="#D9D9D9" stroke-width="1.4"/>
<text x="366" y="176" font-size="12" fill="#141414" text-anchor="start">Sampel: kubu yang saling follow -</text>
<text x="366" y="192" font-size="12" fill="#141414" text-anchor="start">bukan kubu yang jauh.</text>
<text x="366" y="240" font-size="11.5" fill="#5A5A5A" text-anchor="start">Pakai untuk:</text>
<text x="366" y="262" font-size="12" fill="#7A4FA0" font-weight="bold" text-anchor="start">Cocok untuk: analisis tautan relasi</text>
<rect x="672" y="66" width="296" height="230" rx="8" fill="#FDF1EA" stroke="#D55E00" stroke-width="1.8"/>
<text x="688" y="92" font-size="14" fill="#D55E00" font-weight="bold" text-anchor="start">REKOMENDASI</text>
<text x="688" y="122" font-size="12.5" fill="#141414" text-anchor="start">Ranking model memilih apa yang tampil</text>
<line x1="688" y1="150" x2="950" y2="150" stroke="#D9D9D9" stroke-width="1.4"/>
<text x="688" y="176" font-size="12" fill="#141414" text-anchor="start">Sampel: yang direkomendasikan, bukan</text>
<text x="688" y="192" font-size="12" fill="#141414" text-anchor="start">yang tayang semuanya.</text>
<text x="688" y="240" font-size="11.5" fill="#5A5A5A" text-anchor="start">Pakai untuk:</text>
<text x="688" y="262" font-size="12" fill="#D55E00" font-weight="bold" text-anchor="start">Cocok untuk: analisis viralitas - hati-</text>
<text x="688" y="278" font-size="12" fill="#D55E00" font-weight="bold" text-anchor="start">hati-hati bias</text>
<text x="22" y="332" font-size="13" fill="#141414" font-weight="bold" text-anchor="start">Konsekuensi metodologis (yang sering tidak disebut)</text>
<rect x="28" y="350" width="944" height="34" rx="6" fill="#FEF6E7" stroke="#E69F00" stroke-width="1.2"/>
<text x="44" y="372" font-size="12" fill="#141414" text-anchor="start">Feed rekomendasi menyembunyikan waktu tayang asli: jangan baca timestamp sampel rekomendasi sebagai waktu kejadian.</text>
<rect x="28" y="390" width="944" height="34" rx="6" fill="#FEF6E7" stroke="#E69F00" stroke-width="1.2"/>
<text x="44" y="412" font-size="12" fill="#141414" text-anchor="start">Hasil di feed kronologis tidak berlaku di feed rekomendasi tanpa pengkajian ulang.</text>
<rect x="28" y="430" width="944" height="34" rx="6" fill="#FEF6E7" stroke="#E69F00" stroke-width="1.2"/>
<text x="44" y="452" font-size="12" fill="#141414" text-anchor="start">Kombinasi nominal: 'engager' di feed kronologis = siapa saja yang melihat; di rekomendasi = siapa saja yang algoritma pilih.</text>
</svg>