<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 340' width='980' height='340' role='img' aria-label='Funnel lab dari 500 baris mentah menjadi 300 baris layak analisis'><rect x='0' y='0' width='980' height='340' rx='0' fill='#ffffff' stroke='#cbd5e1' stroke-width='1.2'/><text x='490' y='26' font-family='Georgia, serif' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold'>Funnel lab: 500 baris mentah menjadi 300 baris layak analisis</text><rect x='30' y='44' width='720' height='22' rx='4' fill='#e2e8f0' stroke='#2563eb' stroke-width='1.2'/><text x='760' y='60' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>500</text><text x='840' y='60' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Mentah dari kolektor (log lengkap)</text><rect x='30' y='76' width='705' height='22' rx='4' fill='#eff6ff' stroke='#2563eb' stroke-width='1.2'/><text x='745' y='92' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>490</text><text x='840' y='92' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Cek integritas: 10 baris JSON rusak dibuang</text><rect x='30' y='108' width='663' height='22' rx='4' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/><text x='703' y='124' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>461</text><text x='840' y='124' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Dedup dekat: 29 baris tumpang tindih ditandai</text><rect x='30' y='140' width='620' height='22' rx='4' fill='#bfdbfe' stroke='#2563eb' stroke-width='1.2'/><text x='660' y='156' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>431</text><text x='840' y='156' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Saring bot: 30 akun skor tinggi dihilangkan</text><rect x='30' y='172' width='620' height='22' rx='4' fill='#93c5fd' stroke='#2563eb' stroke-width='1.2'/><text x='660' y='188' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>431</text><text x='840' y='188' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Normalisasi: tidak membuang baris, hanya mengubah bentuk</text><rect x='30' y='204' width='593' height='22' rx='4' fill='#60a5fa' stroke='#2563eb' stroke-width='1.2'/><text x='633' y='220' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>412</text><text x='840' y='220' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Quality gate: 19 baris kosong atau teks &lt; 3 token disingkirkan</text><rect x='30' y='236' width='573' height='22' rx='4' fill='#3b82f6' stroke='#2563eb' stroke-width='1.2'/><text x='613' y='252' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>398</text><text x='840' y='252' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Audit manual sampel 5 persen: 14 baris ditandai ragu</text><rect x='30' y='268' width='432' height='22' rx='4' fill='#2563eb' stroke='#2563eb' stroke-width='1.2'/><text x='472' y='284' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='bold'>300</text><text x='840' y='284' font-family='Georgia, serif' font-size='10' fill='#475569' text-anchor='start' font-weight='normal'>Tahap akhir setelah keputusan ragu dibuka</text><rect x='30' y='322' width='920' height='54' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/><text x='44' y='344' font-family='Georgia, serif' font-size='11' fill='#1e293b' text-anchor='start' font-weight='normal'>Pelajaran angka: setiap tahap menyisakan jejak. Laporan cleaning wajib memuat deret 500, 490, 461, 431, 412, 398, 300</text><text x='44' y='364' font-family='Georgia, serif' font-size='11' fill='#475569' text-anchor='start' font-weight='normal'>beserta alasan tiap selisih. Tanpa deret itu, analisis tidak bisa direproduksi oleh peneliti lain.</text></svg>