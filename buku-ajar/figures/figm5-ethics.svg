<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="figm5 ethics">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#4a5568"/></marker>
<marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2f855a"/></marker>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#c53030"/></marker>
</defs>
<style>.t{font-size:16px;fill:#1a202c}.ts{font-size:13px;fill:#2d3748}.tx{font-size:11.5px;fill:#4a5568}.th{font-size:15px;fill:#fff}</style>
<text x="30" y="34" class="t" font-weight="700" font-size="19">Publik ≠ boleh — tiga lingkar izin yang mengecil</text>
<text x="30" y="56" class="tx">Terlihat publik, boleh dianalisis, boleh dibagikan: tiga persetujuan berbeda dengan syarat masing-masing.</text>
<circle cx="480" cy="228" r="150" fill="#eff6ff" stroke="#2b6cb0" stroke-width="2"/>
<circle cx="480" cy="252" r="104" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
<circle cx="480" cy="276" r="58" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
<text x="480" y="96" class="t" text-anchor="middle" font-weight="700" fill="#2b6cb0">TERLIHAT PUBLIK</text>
<text x="480" y="114" class="tx" text-anchor="middle" fill="#2b6cb0">semua yang bisa dibaca siapa pun di halaman terbuka</text>
<text x="480" y="196" class="t" text-anchor="middle" font-weight="700" fill="#b7791f">BOLEH DIANALISIS</text>
<text x="480" y="214" class="tx" text-anchor="middle" fill="#b7791f">persetujuan etik + penghargaan post yang telah dihapus</text>
<text x="480" y="282" class="t" text-anchor="middle" font-weight="700" fill="#2c7a7b">BOLEH DIBAGIKAN</text>
<text x="480" y="300" class="tx" text-anchor="middle" fill="#2c7a7b">anonimisasi agresif; dataset dibagikan dengan rubrik</text>
<rect x="30" y="360" width="880" height="40" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.4"/>
<text x="52" y="385" class="ts" text-anchor="start" fill="#c53030">Melanggar lingkar: menganalisis dari data publik lalu membagikannya utuh beserta identitas akun — pelanggaran hukum dan etika sekaligus.</text>
<text x="30" y="415" class="tx">Izin analisis dan izin publikasi adalah dua surat yang berbeda.</text>
</svg>
