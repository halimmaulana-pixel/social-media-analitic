<text x="620" y="210" font-size="10.5" fill="#141414" text-anchor="start">int</text>
<text x="692" y="210" font-size="10.5" fill="#141414" text-anchor="start">23 - jumlah</text>
<text x="692" y="224" font-size="10.5" fill="#141414" text-anchor="start">balasan</text>
<line x1="514" y1="232" x2="952" y2="232" stroke="#D9D9D9" stroke-width="0.6"/>
<text x="604" y="244" font-size="10.5" fill="#141414" text-anchor="start">repost_cou</text>
<text x="604" y="258" font-size="10.5" fill="#141414" text-anchor="start">nt</text>
<text x="620" y="244" font-size="10.5" fill="#141414" text-anchor="start">int</text>
<text x="692" y="244" font-size="10.5" fill="#141414" text-anchor="start">410 - posting</text>
<text x="692" y="258" font-size="10.5" fill="#141414" text-anchor="start">ulang</text>
<line x1="514" y1="266" x2="952" y2="266" stroke="#D9D9D9" stroke-width="0.6"/>
<text x="604" y="278" font-size="10.5" fill="#141414" text-anchor="start">quote_coun</text>
<text x="604" y="292" font-size="10.5" fill="#141414" text-anchor="start">t</text>
<text x="620" y="278" font-size="10.5" fill="#141414" text-anchor="start">int</text>
<text x="692" y="278" font-size="10.5" fill="#141414" text-anchor="start">95 - quote /</text>
<text x="692" y="292" font-size="10.5" fill="#141414" text-anchor="start">kutipan</text>
<line x1="514" y1="300" x2="952" y2="300" stroke="#D9D9D9" stroke-width="0.6"/>
