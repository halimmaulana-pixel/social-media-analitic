<text x="112" y="488" font-size="13" fill="#141414" font-weight="bold" text-anchor="start">Pilih granularity baris</text>
<text x="112" y="512" font-size="11.5" fill="#5A5A5A" text-anchor="start">satu baris per post, atau per event engagement</text>
<rect x="500" y="62" width="468" height="474" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.4"/>
