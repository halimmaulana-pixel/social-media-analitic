<text x="692" y="380" font-size="10.5" fill="#141414" text-anchor="start">null - bisa</text>
<text x="692" y="394" font-size="10.5" fill="#141414" text-anchor="start">tidak tersedia</text>
<text x="514" y="438" font-size="11.5" fill="#5A5A5A" text-anchor="start">Aturan: kamus harus bisa dipakai mahasiswa lain</text>
<text x="514" y="458" font-size="11.5" fill="#5A5A5A" text-anchor="start">tanpa membaca kode - itulah ujian keterbacaannya.</text>
