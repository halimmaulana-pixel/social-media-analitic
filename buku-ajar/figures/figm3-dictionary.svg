<text x="620" y="176" font-size="10.5" fill="#141414" text-anchor="start">timestamp</text>
<text x="692" y="176" font-size="10.5" fill="#141414" text-anchor="start">2026-10-</text>
<text x="692" y="190" font-size="10.5" fill="#141414" text-anchor="start">25T02:14:05Z -</text>
<text x="692" y="204" font-size="10.5" fill="#141414" text-anchor="start">waktu</text>
<line x1="514" y1="198" x2="952" y2="198" stroke="#D9D9D9" stroke-width="0.6"/>
