<text x="112" y="288" font-size="13" fill="#141414" font-weight="bold" text-anchor="start">Isi tipe tiap field</text>
<text x="112" y="312" font-size="11.5" fill="#5A5A5A" text-anchor="start">text / angka / timestamp / enum / objek</text>
<line x1="58" y1="308" x2="58" y2="354" stroke="#0072B2" stroke-width="2" marker-end="url(#ahb)"/>
<circle cx="58" cy="388" r="18" fill="#0072B2"/>
<text x="58" y="393" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<rect x="96" y="364" width="380" height="66" rx="8" fill="#F2F8FD" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="112" y="388" font-size="13" fill="#141414" font-weight="bold" text-anchor="start">Tulis arti &amp; missingness</text>
<text x="112" y="412" font-size="11.5" fill="#5A5A5A" text-anchor="start">apa yang terjadi bila field tidak ada?</text>
<line x1="58" y1="408" x2="58" y2="454" stroke="#0072B2" stroke-width="2" marker-end="url(#ahb)"/>
