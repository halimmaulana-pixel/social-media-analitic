<text x="58" y="93" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<rect x="96" y="64" width="380" height="66" rx="8" fill="#F2F8FD" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="112" y="88" font-size="13" fill="#141414" font-weight="bold" text-anchor="start">Ambil 500 objek dari API</text>
<text x="112" y="112" font-size="11.5" fill="#5A5A5A" text-anchor="start">sampel mentah, jangan diubah dahulu</text>
<line x1="58" y1="108" x2="58" y2="154" stroke="#0072B2" stroke-width="2" marker-end="url(#ahb)"/>
