<text x="112" y="188" font-size="13" fill="#141414" font-weight="bold" text-anchor="start">Daftar semua field yang muncul</text>
<text x="112" y="212" font-size="11.5" fill="#5A5A5A" text-anchor="start">field bersarang pakai jalur penuh: metrics.like</text>
