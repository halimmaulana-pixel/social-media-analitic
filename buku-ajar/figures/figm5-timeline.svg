<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="figm5 timeline">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#4a5568"/></marker>
<marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2f855a"/></marker>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#c53030"/></marker>
</defs>
<style>.t{font-size:16px;fill:#1a202c}.ts{font-size:13px;fill:#2d3748}.tx{font-size:11.5px;fill:#4a5568}.th{font-size:15px;fill:#fff}</style>
<text x="30" y="34" class="t" font-weight="700" font-size="19">Timeline kebijakan akses akademik 2021–2026</text>
<text x="30" y="56" class="tx">Peta perubahan besar; peristiwa makin baru makin cepat berubah — semua angka wajib diverifikasi ulang.</text>
<line x1="60" y1="240" x2="880" y2="240" stroke="#4a5568" stroke-width="2.4" marker-end="url(#ar)"/>
<circle cx="120" cy="240" r="8" fill="#2f855a"/>
<text x="120" y="272" class="t" text-anchor="middle" font-weight="700">2021</text>
<text x="120" y="150" class="tx" text-anchor="middle">Era API longgar:</text>
<text x="120" y="167" class="tx" text-anchor="middle">tier akademik gratis</text>
<text x="120" y="184" class="tx" text-anchor="middle">masih tersedia</text>
<line x1="120" y1="195" x2="120" y2="234" stroke="#2f855a" stroke-width="1.4"/>
<circle cx="300" cy="240" r="8" fill="#c05621"/>
<text x="300" y="272" class="t" text-anchor="middle" font-weight="700">2023</text>
<text x="300" y="88" class="tx" text-anchor="middle">X menghentikan tier</text>
<text x="300" y="105" class="tx" text-anchor="middle">gratis; Reddit menetapkan</text>
<text x="300" y="122" class="tx" text-anchor="middle">harga Data API</text>
<line x1="300" y1="133" x2="300" y2="172" stroke="#c05621" stroke-width="1.4"/>
<circle cx="490" cy="240" r="8" fill="#c05621"/>
<text x="490" y="272" class="t" text-anchor="middle" font-weight="700">2024</text>
<text x="490" y="150" class="tx" text-anchor="middle">Meta Content Library</text>
<text x="490" y="167" class="tx" text-anchor="middle">diumumkan pengganti</text>
<text x="490" y="184" class="tx" text-anchor="middle">CrowdTangle</text>
<line x1="490" y1="195" x2="490" y2="234" stroke="#c05621" stroke-width="1.4"/>
<circle cx="670" cy="240" r="8" fill="#9b2c2c"/>
<text x="670" y="272" class="t" text-anchor="middle" font-weight="700">2025-26</text>
<text x="670" y="88" class="tx" text-anchor="middle">Biaya enclave dilaporkan</text>
<text x="670" y="105" class="tx" text-anchor="middle">publik; DSA memata</text>
<text x="670" y="122" class="tx" text-anchor="middle">keras transparansi Eropa</text>
<line x1="670" y1="133" x2="670" y2="172" stroke="#9b2c2c" stroke-width="1.4"/>
<circle cx="828" cy="240" r="8" fill="#9b2c2c"/>
<text x="828" y="272" class="t" text-anchor="middle" font-weight="700">2026</text>
<text x="828" y="150" class="tx" text-anchor="middle">Peta akses berubah</text>
<text x="828" y="167" class="tx" text-anchor="middle">terus — cek sumber resmi</text>
<text x="828" y="184" class="tx" text-anchor="middle">tiap semester</text>
<line x1="828" y1="195" x2="828" y2="234" stroke="#9b2c2c" stroke-width="1.4"/>
<text x="30" y="415" class="tx">Sumber: dokumentasi resmi tiap platform dan laporan komunitas riset 2021–2026 (indikatif).</text>
</svg>
