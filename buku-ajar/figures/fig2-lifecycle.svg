<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Siklus hidup data Social Media Analytics" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4D4D4D"/></marker></defs>
<rect x="0" y="0" width="1000" height="300" fill="#FFFFFF"/>
<text x="500" y="30" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">Gambar 2. Siklus hidup data SMA: enam tahap, satu putaran iteratif</text><rect x="22" y="66" width="148" height="118" rx="10" fill="#F2F8FD" stroke="#8C8C8C" stroke-width="1.6" opacity="1.0"/><text x="30" y="88" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">1. Rumusan pertanyaan</text><text x="30" y="104.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Buat pertanyaan terukur:</text><text x="30" y="117.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">siapa, apa, kapan,</text><text x="30" y="131.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">dibandingkan dengan apa</text><line x1="171" y1="125.0" x2="183" y2="125.0" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="185" y="66" width="148" height="118" rx="10" fill="#FFF7EC" stroke="#8C8C8C" stroke-width="1.6" opacity="1.0"/><text x="193" y="88" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">2. Akses &amp; akuisisi</text><text x="193" y="104.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">API resmi / sumber sah</text><text x="193" y="117.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Kuota, filter, sampling</text><text x="193" y="131.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">frame, arsip + checksum</text><line x1="334" y1="125.0" x2="346" y2="125.0" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="348" y="66" width="148" height="118" rx="10" fill="#F3FBF6" stroke="#8C8C8C" stroke-width="1.6" opacity="1.0"/><text x="356" y="88" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">3. Preprocessing</text><text x="356" y="104.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Normalisasi, dedup,</text><text x="356" y="117.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">bot filter, bahasa &amp;</text><text x="356" y="131.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">code-mixing, anonimisasi</text><line x1="497" y1="125.0" x2="509" y2="125.0" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="511" y="66" width="148" height="118" rx="10" fill="#FCFBE8" stroke="#8C8C8C" stroke-width="1.6" opacity="1.0"/><text x="519" y="88" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">4. Analisis / model</text><text x="519" y="104.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Sentimen, topik, jaringan,</text><text x="519" y="117.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">engagement, multimodal,</text><text x="519" y="131.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">evaluasi metrik</text><line x1="660" y1="125.0" x2="672" y2="125.0" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="674" y="66" width="148" height="118" rx="10" fill="#F7F2FA" stroke="#8C8C8C" stroke-width="1.6" opacity="1.0"/><text x="682" y="88" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">5. Visualisasi</text><text x="682" y="104.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Graf, tren, dashboard,</text><text x="682" y="117.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">chart jujur +</text><text x="682" y="131.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">ketidakpastian</text><line x1="823" y1="125.0" x2="835" y2="125.0" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="837" y="66" width="148" height="118" rx="10" fill="#F5F5F5" stroke="#8C8C8C" stroke-width="1.6" opacity="1.0"/><text x="845" y="88" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#111111" font-weight="bold" text-anchor="start" letter-spacing="0">6. Interpretasi &amp; preservasi</text><text x="845" y="104.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Insight + keterbatasan</text><text x="845" y="117.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Publikasi &amp; replicasi</text><text x="845" y="131.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Data &amp; kode disimpan</text><text x="500" y="210" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle" letter-spacing="0">Umpan balik: temuan baru memperbaiki rumusan pertanyaan, sampling frame, atau codebook label</text><polygon points="122.0,194 96.0,218 70.0,194" fill="none" stroke="#8C8C8C" stroke-width="1.6"/><line x1="911.0" y1="194" x2="911.0" y2="214" stroke="#8C8C8C" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="911.0" y1="214" x2="122.0" y2="214" stroke="#8C8C8C" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="122.0" y1="214" x2="122.0" y2="196" stroke="#8C8C8C" stroke-width="1.6" stroke-dasharray="4 4"/><text x="500" y="242" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#8A3D00" font-weight="normal" text-anchor="middle" letter-spacing="0">Tahap yang paling sering disalahartikan mahasiswa: 2 (sampling frame) dan 6 (interpretasi) — bukan tahap 4</text></svg>