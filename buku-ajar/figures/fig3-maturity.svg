<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 400" width="100%" role="img" aria-label="Tangga maturitas analitik: deskriptif, diagnostik, prediktif, preskriptif" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4D4D4D"/></marker></defs>
<rect x="0" y="0" width="990" height="400" fill="#FFFFFF"/>
<text x="495" y="30" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" letter-spacing="0">Gambar 3. Tangga maturitas analitik (descriptive → prescriptive)</text><text x="495" y="50" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#555555" font-weight="normal" text-anchor="middle" letter-spacing="0">Semakin ke kanan, nilai naik tetapi biaya data, asumsi model, dan risiko salah-tafsir juga naik</text><rect x="30" y="62" width="228" height="205" rx="10" fill="#F2F8FD" stroke="#0072B2" stroke-width="1.8" opacity="1.0"/><text x="144.0" y="84" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#0072B2" font-weight="bold" text-anchor="middle" letter-spacing="0">DESKRIPTIF</text><text x="144.0" y="102" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#111111" font-weight="normal" text-anchor="middle" letter-spacing="0">Apa yang terjadi?</text><line x1="42" y1="112" x2="246" y2="112" stroke="#C8C8C8" stroke-width="1"/><text x="44" y="132" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Hitungan, tren, porsi,</text><text x="44" y="148" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">perbandingan antar-platform</text><text x="44" y="180" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#0072B2" font-weight="bold" text-anchor="start" letter-spacing="0">Contoh: 62% post negatif</text><text x="44" y="196" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Tools: API, pandas, chart</text><text x="44" y="220" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#777777" font-weight="normal" text-anchor="start" letter-spacing="0">Bukti: angka + rentang</text><line x1="259" y1="164.5" x2="269" y2="160.5" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="271" y="70" width="228" height="205" rx="10" fill="#F3FBF6" stroke="#009E73" stroke-width="1.8" opacity="1.0"/><text x="385.0" y="92" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#009E73" font-weight="bold" text-anchor="middle" letter-spacing="0">DIAGNOSTIK</text><text x="385.0" y="110" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#111111" font-weight="normal" text-anchor="middle" letter-spacing="0">Mengapa terjadi?</text><line x1="283" y1="120" x2="487" y2="120" stroke="#C8C8C8" stroke-width="1"/><text x="285" y="140" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Sub-grup, aspek, peristiwa</text><text x="285" y="156" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">pemicu (crash, kebijakan)</text><text x="285" y="188" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#009E73" font-weight="bold" text-anchor="start" letter-spacing="0">Contoh: lonjakan minggu 3</text><text x="285" y="204" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Tools: ABSA, topic model</text><text x="285" y="228" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#777777" font-weight="normal" text-anchor="start" letter-spacing="0">Bukti: bandingan terkontrol</text><line x1="500" y1="172.5" x2="510" y2="168.5" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="512" y="78" width="228" height="205" rx="10" fill="#FCFBE8" stroke="#F0E442" stroke-width="1.8" opacity="1.0"/><text x="626.0" y="100" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#F0E442" font-weight="bold" text-anchor="middle" letter-spacing="0">PREDIKTIF</text><text x="626.0" y="118" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#111111" font-weight="normal" text-anchor="middle" letter-spacing="0">Apa yang akan terjadi?</text><line x1="524" y1="128" x2="728" y2="128" stroke="#C8C8C8" stroke-width="1"/><text x="526" y="148" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Prediksi engagement,</text><text x="526" y="164" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">viralitas, churn, tren</text><text x="526" y="196" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#F0E442" font-weight="bold" text-anchor="start" letter-spacing="0">Contoh: post akan trending</text><text x="526" y="212" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Tools: ML/LLM, time series</text><text x="526" y="236" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#777777" font-weight="normal" text-anchor="start" letter-spacing="0">Bukti: uji out-of-sample</text><line x1="741" y1="180.5" x2="751" y2="176.5" stroke="#4D4D4D" stroke-width="2.0" marker-end="url(#ah)"/><rect x="753" y="86" width="228" height="205" rx="10" fill="#FFF7EC" stroke="#D55E00" stroke-width="1.8" opacity="1.0"/><text x="867.0" y="108" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#D55E00" font-weight="bold" text-anchor="middle" letter-spacing="0">PRESKRIPTIF</text><text x="867.0" y="126" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#111111" font-weight="normal" text-anchor="middle" letter-spacing="0">Apa yang harus dilakukan?</text><line x1="765" y1="136" x2="969" y2="136" stroke="#C8C8C8" stroke-width="1"/><text x="767" y="156" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">Rekomendasi aksi,</text><text x="767" y="172" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" letter-spacing="0">alokasi anggaran konten</text><text x="767" y="204" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" fill="#D55E00" font-weight="bold" text-anchor="start" letter-spacing="0">Contoh: geser 30% budget</text><text x="767" y="220" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10" fill="#555555" font-weight="normal" text-anchor="start" letter-spacing="0">Tools: optimasi + evaluasi</text><text x="767" y="244" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="9.8" fill="#777777" font-weight="normal" text-anchor="start" letter-spacing="0">Bukti: uji dampak</text><text x="495" y="366" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#8A3D00" font-weight="bold" text-anchor="middle" letter-spacing="0">Aturan praktik: jangan pernah naik tingkat tanpa bukti di tingkat bawah. Insight preskriptif tanpa diagnostik = opini.</text></svg>