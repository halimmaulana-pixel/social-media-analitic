<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="figm4 pagination" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#141414"/></marker></defs>
<text x="22" y="30" font-size="15" fill="#0072B2" font-weight="bold" text-anchor="start">Dua mekanisme halaman: cursor pagination vs potongan waktu</text>
<rect x="30" y="58" width="940" height="170" rx="10" fill="#F2F8FD" stroke="#0072B2" stroke-width="1.3"/>
<text x="46" y="82" font-size="13" fill="#0072B2" font-weight="bold" text-anchor="start">A. CURSOR PAGINATION — API deserahkan token 'lanjut dari sini'</text>
<rect x="46" y="96" width="130" height="62" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="111" y="116" font-size="12" fill="#141414" text-anchor="middle">request#1</text>
<rect x="300" y="96" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="400" y="116" font-size="12" fill="#141414" text-anchor="middle">page 1</text>
<text x="400" y="134" font-size="12" fill="#141414" text-anchor="middle">next_token = c1</text>
<rect x="560" y="96" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="660" y="116" font-size="12" fill="#141414" text-anchor="middle">request#2</text>
<text x="660" y="134" font-size="12" fill="#141414" text-anchor="middle">(next_token=c1)</text>
<rect x="820" y="96" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="920" y="116" font-size="12" fill="#141414" text-anchor="middle">page 2 …</text>
<line x1="178" y1="127" x2="298" y2="127" stroke="#0072B2" stroke-width="2" marker-end="url(#ahb)"/>
<line x1="502" y1="127" x2="558" y2="127" stroke="#0072B2" stroke-width="2" marker-end="url(#ahb)"/>
<line x1="762" y1="127" x2="818" y2="127" stroke="#0072B2" stroke-width="2" marker-end="url(#ahb)"/>
<text x="46" y="188" font-size="12" fill="#5A5A5A" text-anchor="start">selama next_token masih dikirim → terus; token habis → berputar dari token null. cursor membuat trek tak bisa</text>
<text x="46" y="204" font-size="12" fill="#5A5A5A" text-anchor="start">loncat.</text>
<text x="46" y="218" font-size="12" fill="#9B2C2C" text-anchor="start">Dedup tetap wajib: retweet/konten editan bisa muncul dobel antar halaman.</text>
<rect x="30" y="240" width="940" height="150" rx="10" fill="#FDF1EA" stroke="#D55E00" stroke-width="1.3"/>
<text x="46" y="264" font-size="13" fill="#D55E00" font-weight="bold" text-anchor="start">B. POTONGAN WAKTU — kuota kecil? bagi rentang tanggal menjadi jendela</text>
<rect x="46" y="280" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="141" y="306" font-size="12" fill="#141414" text-anchor="middle">jendela 11–17 Mar</text>
<text x="141" y="326" font-size="11" fill="#5A5A5A" text-anchor="middle">max_results fase per jendela</text>
<rect x="276" y="280" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="371" y="306" font-size="12" fill="#141414" text-anchor="middle">jendela 18–24 Mar</text>
<text x="371" y="326" font-size="11" fill="#5A5A5A" text-anchor="middle">max_results fase per jendela</text>
<rect x="506" y="280" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="601" y="306" font-size="12" fill="#141414" text-anchor="middle">jendela 25–31 Mar</text>
<text x="601" y="326" font-size="11" fill="#5A5A5A" text-anchor="middle">max_results fase per jendela</text>
<rect x="736" y="280" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="831" y="306" font-size="12" fill="#141414" text-anchor="middle">jendela 1–7 Apr</text>
<text x="831" y="326" font-size="11" fill="#5A5A5A" text-anchor="middle">max_results fase per jendela</text>
<line x1="238" y1="308" x2="274" y2="308" stroke="#D55E00" stroke-width="1.6" marker-end="url(#ahb)"/>
<line x1="468" y1="308" x2="504" y2="308" stroke="#D55E00" stroke-width="1.6" marker-end="url(#ahb)"/>
<line x1="698" y1="308" x2="734" y2="308" stroke="#D55E00" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="46" y="366" font-size="12" fill="#9B2C2C" text-anchor="start">Hati-hati dobel di tepi jendela: dedup by post_id + cap waktu eksklusif (batas kiri termasuk, batas kanan tidak).</text>
<rect x="30" y="404" width="940" height="48" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.4"/>
<text x="46" y="432" font-size="12.5" fill="#009E73" text-anchor="start">Angka halaman yang selalu sama persis (mis. 200 tiap run) = tanda query terpotong diam-diam (silent truncation). Catat!</text>
</svg>